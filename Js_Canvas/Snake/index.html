<canvas id="gc" width="400" height="400"></canvas>
<script>
  /*
              ╭───────────────────────────────────────────────────────╮
              │                 Analizis De Youtube                         │
              ╰───────────────────────────────────────────────────────╯
  */

  window.onload = function () {
    canv = document.getElementById("gc");
    ctx = canv.getContext("2d");
    document.addEventListener("keydown", keyPush);
    setInterval(game, 1000 / 15); // 15 FPS
  };

  // [ ⚙️ CONFIG ]
  positionx = positiony = 10; // Cabeza
  grid = tc = 20; // Grid px y Tiles
  appleX = appleY = 15; // Manzana
  xv = yv = 0; // Velocidad
  trail = []; // Cuerpo
  tail = 5; // Largo

  function game() {
    positionx += xv;
    positiony += yv; // Mover

    // [ 🔄 BORDES ]
    if (positionx < 0) positionx = tc - 1;
    if (positionx > tc - 1) positionx = 0;
    if (positiony < 0) positiony = tc - 1;
    if (positiony > tc - 1) positiony = 0;

    // [ 🎨 RENDER ]
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canv.width, canv.height); // Fondo

    ctx.fillStyle = "blue";
    for (var i = 0; i < trail.length; i++) {
      ctx.fillRect(trail[i].x * grid, trail[i].y * grid, grid - 2, grid - 2); // Cuerpo
      if (trail[i].x == positionx && trail[i].y == positiony) tail = 1; // Choque cuerpo
    }

    // [ 🐍 LÓGICA COLA ]
    trail.push({ x: positionx, y: positiony }); //Inserta datos
    while (trail.length > tail) trail.shift(); //Limpia Cola

    // [ 🍎 COMIDA ]
    if (appleX == positionx && appleY == positiony) {
      tail++;
      appleX = Math.floor(Math.random() * tc);
      appleY = Math.floor(Math.random() * tc);
    }

    ctx.fillStyle = "red";
    ctx.fillRect(appleX * grid, appleY * grid, grid - 2, grid - 2); // Manzana
  }

  // [ ⌨️ INPUT ]
  function keyPush(evt) {
    switch (evt.keyCode) {
      case 37:
        xv = -1;
        yv = 0;
        break; // ←
      case 38:
        xv = 0;
        yv = -1;
        break; // ↑
      case 39:
        xv = 1;
        yv = 0;
        break; // →
      case 40:
        xv = 0;
        yv = 1;
        break; // ↓
    }
  }
</script>
